<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToDo list</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/todo.js"></script>
</head>
<body>
    <div class="container">
        <h1>Мои задачи</h1>
        <div id="newtask">
            <input type="text" placeholder="Введите описание задачи">
            <button id="push" title="Добавить задачу" aria-label="Добавить задачу">
                <!-- SVG-иконка «плюс» вместо надписи «Добавить» -->
                <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
                    <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.5"
                          stroke-linecap="round" fill="none"/>
                </svg>
            </button>
        </div>
        <div id="tasks"></div>
    </div>
</body>
</html>
